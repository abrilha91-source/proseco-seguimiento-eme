<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Seguimiento PROSECO · EME</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mk">PS</span><div><b>Seguimiento PROSECO</b><span>Escuela Militar de Enfermería</span></div></div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" data-v="pan" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Panorama</span></button>
      <button role="tab" data-v="ind" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><circle cx="12" cy="7" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="17" r="1.8"/></svg><span>Indicadores</span><i class="cnt" id="cntR"></i></button>
      <button role="tab" data-v="dg" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Datos generales</span></button>
      <button role="tab" data-v="tri" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Trimestres</span></button>
      <button role="tab" data-v="gui" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5v.01"/></svg><span>Guía</span></button>
      <button role="tab" data-v="res" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 14v5h14v-5"/></svg><span>Respaldo y exportar</span></button>
    </nav>
    <div class="railfoot"><span id="storeSt">Datos solo en este dispositivo</span><span>v1.0</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="ttl"><p id="gDate"></p><strong id="gTri">Sin trimestre</strong></div>
      <label class="trisel">Trimestre<select id="selTri" aria-label="Trimestre activo"></select></label>
      <button class="btn ghost sm" id="btnNewTri" type="button">+ Nuevo trimestre</button>
      <button class="btn ghost sm" id="btnTour" type="button" title="Recorrido guiado">▶ Guía interactiva</button>
    </header>
    <main id="view"><div class="empty"><strong>Cargando…</strong></div></main>
  </div>
</div>

<dialog id="dAsk" class="sm"><form method="dialog" class="dlg"><h2 id="askT">Confirmar</h2><p id="askM"></p>
  <div class="acts"><button class="btn ghost" value="no" formnovalidate>Cancelar</button><button class="btn" value="ok" id="askOk">Confirmar</button></div></form></dialog>
<dialog id="dInd" class="lg"><div class="dlg" id="indBody"></div></dialog>
<dialog id="dTri" class="sm"><form method="dialog" class="dlg" id="triForm">
  <h2>Nuevo trimestre</h2>
  <label>Nombre<input id="tNom" required placeholder="Ej. 1/er. Trimestre 2027"></label>
  <label>Meses que abarca<input id="tMes" placeholder="Ej. Sep., Oct., Nov."></label>
  <label>Año<input id="tAnio" type="number" min="2020" max="2100"></label>
  <label>Copiar estructura de<select id="tBase"></select></label>
  <fieldset class="chk" id="tOpts">
    <label><input type="checkbox" id="tCpArea" checked> Copiar «Área responsable»</label>
    <label><input type="checkbox" id="tCpSem"> Copiar el semáforo (si no, inicia en «Sin definir»)</label>
    <label><input type="checkbox" id="tCpDg"> Copiar datos generales</label>
  </fieldset>
  <p class="hint">Las acciones, notas y archivos no se copian: cada trimestre lleva su propia evidencia.</p>
  <div class="acts"><button class="btn ghost" value="no" formnovalidate>Cancelar</button><button class="btn" value="ok">Crear trimestre</button></div>
</form></dialog>
<dialog id="dAcc" class="sm"><form method="dialog" class="dlg" id="accForm">
  <h2 id="accT">Nueva acción</h2>
  <label>Fecha<input id="aFecha" type="date" required></label>
  <label>Acción realizada para dar cumplimiento<textarea id="aDesc" rows="4" required placeholder="Describe qué se hizo"></textarea></label>
  <label>Responsable (opcional)<input id="aResp" placeholder="Quién la realizó"></label>
  <label>Adjuntar archivos (imagen, PDF, Word, Excel, CSV o audio)<input id="aFiles" type="file" multiple accept="image/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"></label>
  <p class="hint" id="aFilesHint">Los archivos se guardan solo en este dispositivo.</p>
  <div class="acts"><button class="btn ghost" value="no" formnovalidate>Cancelar</button><button class="btn" value="ok">Guardar acción</button></div>
</form></dialog>
<dialog id="dImg" class="lg"><div class="dlg"><div id="imgBody"></div><div class="acts"><button class="btn" id="imgClose">Cerrar</button></div></div></dialog>

<div id="tourLayer" hidden><div class="tourHole" id="tourHole"></div><div class="tourBox" id="tourBox" role="dialog" aria-live="polite"></div></div>
<div id="printArea" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="catalogo.js"></script>
<script src="app.js"></script>
</body>
</html>
